<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | RentEZ</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/customer_profile.css') }}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            <i class="ri-lock-password-line"></i>
        </div>

        <span class="eyebrow">
            ACCOUNT RECOVERY
        </span>

        <h1>
            Forgot Password?
        </h1>

        <p>
            Enter your registered email address and we'll send
            you a secure password reset link.
        </p>


        <form
            method="POST"
            action="{{ url_for('forgot_password') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn"
            >
                Send Reset Link
            </button>

        </form>


        {% if reset_message %}

        <div class="message success">

            <i class="ri-checkbox-circle-line"></i>

            {{ reset_message }}

        </div>

        {% endif %}


        <a
            href="{{ url_for('login') }}"
            class="back-link"
        >
            <i class="ri-arrow-left-line"></i>
            Back to Login
        </a>

    </div>

</div>

</body>

</html>
